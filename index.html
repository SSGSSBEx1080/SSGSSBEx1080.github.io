<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Universe Ultimate Marathon Checklist Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dc-blue: #0066ff;
            --dc-blue-glow: rgba(0, 102, 255, 0.35);
            --dc-gold: #ffb700;
            --bg-dark: #07090f;
            --card-dark: #0f1422;
            --card-hover: #172033;
            --border-dark: #1d273c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(0, 102, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.9) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #07090f; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dc-blue); }

        .item-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 102, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--dc-blue-glow);
        }

        .item-card.watched {
            opacity: 0.82;
            border-color: rgba(34, 197, 94, 0.4);
            background-color: rgba(15, 23, 42, 0.7);
        }

        .item-card.watched .poster-img {
            filter: grayscale(0.25) contrast(0.95);
        }

        .glass-panel {
            background: rgba(15, 20, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .poster-aspect { aspect-ratio: 2 / 3; }
    </style>
</head>
<body class="antialiased pb-20 selection:bg-blue-600 selection:text-white">

    <header class="glass-panel sticky top-0 z-40 px-4 py-3 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-600 to-blue-800 text-white font-black text-2xl px-3.5 py-1 rounded-xl shadow-lg shadow-blue-900/40 tracking-tighter border border-blue-400/30 flex items-center gap-1.5">
                    <i class="fa-solid fa-mask text-xl text-yellow-400"></i> DC
                </div>
                <div>
                    <h1 class="font-cinzel text-xl md:text-2xl font-black text-white tracking-wider flex items-center gap-2">
                        CHECKLIST <span class="text-xs bg-blue-900/60 text-blue-300 border border-blue-700/60 px-2 py-0.5 rounded-md font-sans tracking-normal">ULTIMATE V2</span>
                    </h1>
                    <p class="text-xs text-slate-400">Полный интерактивный путеводитель по вселенным DC Comics</p>
                </div>
            </div>

            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <div class="flex flex-col w-full md:w-64 gap-1">
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-slate-400">Прогресс марафона</span>
                        <span id="overallPercentage" class="text-blue-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-3 border border-slate-800 overflow-hidden relative">
                        <div id="overallProgressBar" class="bg-gradient-to-r from-blue-600 via-blue-500 to-emerald-400 h-full w-0 transition-all duration-500 rounded-full"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500">
                        <span id="statsWatchedCount">0 из 0 просмотрено</span>
                        <span id="statsWatchTime">~0 ч. просмотра</span>
                    </div>
                </div>

                <div class="flex gap-2 shrink-0 border-l border-slate-800 pl-3">
                    <button onclick="exportUserData()" title="Скачать сохранение" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 transition shadow-sm">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button onclick="triggerImport()" title="Загрузить сохранение" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 transition shadow-sm">
                        <i class="fa-solid fa-upload"></i>
                    </button>
                    <input type="file" id="importInput" class="hidden" accept=".json" onchange="importUserData(event)">
                    <button onclick="confirmReset()" title="Сбросить прогресс" class="p-2.5 bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-xl border border-red-800/50 transition shadow-sm">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
        
        <!-- Search, View Switcher & Filters -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-6 space-y-4 shadow-xl">
            
            <div class="flex flex-col lg:flex-row gap-3 justify-between items-center">
                <!-- Search Box -->
                <div class="relative w-full lg:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Поиск (Бэтмен, Супермен, Джокер, Снайдер...)" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition shadow-inner">
                </div>

                <!-- Sort & Display Mode Switches -->
                <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-end overflow-x-auto pb-1 lg:pb-0">
                    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 shrink-0">
                        <span class="text-xs text-slate-500 px-2 font-medium">Порядок:</span>
                        <button onclick="setSortMode('RELEASE')" id="sortReleaseBtn" class="text-xs px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold transition">Релиз</button>
                        <button onclick="setSortMode('CHRONO')" id="sortChronoBtn" class="text-xs px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white font-semibold transition">Хронология</button>
                    </div>

                    <!-- Layout Mode Toggle -->
                    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 shrink-0">
                        <button onclick="setViewMode('GRID')" id="viewGridBtn" class="p-1.5 px-3 rounded-lg bg-blue-600 text-white text-xs font-medium transition" title="Плитка с постерами">
                            <i class="fa-solid fa-grip-vertical mr-1"></i> Постеры
                        </button>
                        <button onclick="setViewMode('LIST')" id="viewListBtn" class="p-1.5 px-3 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition" title="Компактный список">
                            <i class="fa-solid fa-list mr-1"></i> Список
                        </button>
                    </div>
                </div>
            </div>

            <!-- Type Filter Buttons -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-800/80">
                <button onclick="setTypeFilter('ALL', this)" class="type-btn active bg-blue-600 text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-blue-500 transition">Все форматы</button>
                <button onclick="setTypeFilter('MOVIE', this)" class="type-btn bg-slate-950 text-slate-400 hover:text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-800 transition"><i class="fa-solid fa-film mr-1.5 text-blue-400"></i>Фильмы</button>
                <button onclick="setTypeFilter('SERIES', this)" class="type-btn bg-slate-950 text-slate-400 hover:text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-800 transition"><i class="fa-solid fa-tv mr-1.5 text-purple-400"></i>Сериалы</button>
                <button onclick="setTypeFilter('ANIMATION', this)" class="type-btn bg-slate-950 text-slate-400 hover:text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-800 transition"><i class="fa-solid fa-wand-magic-sparkles mr-1.5 text-emerald-400"></i>Анимация</button>
                <button onclick="setTypeFilter('UNWATCHED', this)" class="type-btn bg-slate-950 text-slate-400 hover:text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-800 transition"><i class="fa-regular fa-circle mr-1.5 text-amber-400"></i>Непросмотрено</button>
                <button onclick="setTypeFilter('FAVORITE', this)" class="type-btn bg-slate-950 text-amber-400 hover:text-amber-300 text-xs font-semibold px-3.5 py-2 rounded-xl border border-slate-800 transition"><i class="fa-solid fa-star mr-1.5"></i>Избранное</button>
            </div>

            <!-- Era / Universe Navigation Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto pt-2 border-t border-slate-800/80 no-scrollbar">
                <button onclick="setEraFilter('ALL', this)" class="era-tab active text-xs font-bold px-3.5 py-1.5 rounded-xl bg-blue-900/50 text-blue-300 border border-blue-700/60 whitespace-nowrap transition">⚡ Все Вселенные</button>
                <button onclick="setEraFilter('DCU', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">✨ DCU (James Gunn)</button>
                <button onclick="setEraFilter('DCEU', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">🦇 DCEU (SnyderVerse)</button>
                <button onclick="setEraFilter('DARK_KNIGHT', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">🤡 Nolan & Reeves Elseworlds</button>
                <button onclick="setEraFilter('ARROWVERSE', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">🏹 Arrowverse & TV</button>
                <button onclick="setEraFilter('ANIMATED', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">💥 DCAU & Tomorrowverse</button>
                <button onclick="setEraFilter('UPCOMING', this)" class="era-tab text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700 whitespace-nowrap transition">⏳ Скоро на экранах</button>
            </div>

        </div>

        <!-- Dynamic Content Section Grid / List Container -->
        <div id="contentList" class="space-y-10">
            <!-- Rendered by JavaScript -->
        </div>

    </main>

    <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl space-y-5">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white p-2 rounded-xl transition w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="flex flex-col sm:flex-row gap-5 items-start">
                <div class="w-32 sm:w-40 shrink-0 poster-aspect rounded-xl overflow-hidden bg-slate-950 border border-slate-800 shadow-md">
                    <img id="modalPoster" src="" alt="Poster" class="w-full h-full object-cover">
                </div>
                <div class="space-y-2 flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span id="modalTypeBadge" class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md bg-blue-900/60 text-blue-300 border border-blue-700/50"></span>
                        <span id="modalEraBadge" class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700"></span>
                        <span id="modalYear" class="text-xs text-slate-400 font-semibold"></span>
                    </div>
                    <h3 id="modalTitle" class="text-xl sm:text-2xl font-black text-white leading-tight"></h3>
                    <p id="modalOrigTitle" class="text-xs italic text-slate-400"></p>
                    <p id="modalOverview" class="text-xs text-slate-300 leading-relaxed pt-1"></p>
                    
                    <div class="flex items-center gap-4 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                        <div><i class="fa-regular fa-clock mr-1 text-blue-400"></i><span id="modalDuration"></span></div>
                        <div><i class="fa-solid fa-star mr-1 text-amber-400"></i>IMDb: <span id="modalImdb" class="font-bold text-slate-200"></span></div>
                    </div>
                </div>
            </div>

            <!-- Post Credits Box -->
            <div id="modalCreditsInfo" class="bg-blue-950/40 border border-blue-800/50 rounded-xl p-3.5 text-xs text-blue-200 flex items-start gap-2.5">
                <i class="fa-solid fa-film text-blue-400 text-base shrink-0 mt-0.5"></i>
                <div>
                    <span class="font-bold text-blue-300 block mb-0.5">Сцены после титров:</span>
                    <span id="modalCreditsText">...</span>
                </div>
            </div>

            <!-- Star Rating Input -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-300">Ваша персональная оценка:</span>
                <div id="modalStars" class="star-rating text-amber-400 text-lg flex gap-1 cursor-pointer">
                    <i class="fa-regular fa-star" onclick="setModalRating(1)"></i>
                    <i class="fa-regular fa-star" onclick="setModalRating(2)"></i>
                    <i class="fa-regular fa-star" onclick="setModalRating(3)"></i>
                    <i class="fa-regular fa-star" onclick="setModalRating(4)"></i>
                    <i class="fa-regular fa-star" onclick="setModalRating(5)"></i>
                </div>
            </div>

            <!-- User Note Input -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> Личные заметки:
                </label>
                <textarea id="modalNote" rows="3" placeholder="Ваши впечатление, пасхалки или любимые сцены..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 resize-none transition"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="saveModalData()" class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold text-xs py-3 rounded-xl border border-blue-400/30 shadow-lg transition">
                    Сохранить изменения
                </button>
            </div>
        </div>
    </div>

        function renderApp() {
            const container = document.getElementById('contentList');
            container.innerHTML = '';

            // Filter items
            let filtered = dcDatabase.filter(item => {
                const matchQuery = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                   item.origTitle.toLowerCase().includes(searchQuery.toLowerCase());
                
                let matchType = true;
                if (currentType === 'UNWATCHED') matchType = !userState[item.id]?.watched;
                else if (currentType === 'FAVORITE') matchType = !!userState[item.id]?.favorite;
                else if (currentType !== 'ALL') matchType = item.type === currentType;

                let matchEra = true;
                if (currentEra === 'UPCOMING') matchEra = item.era === 'UPCOMING';
                else if (currentEra !== 'ALL') matchEra = item.era === currentEra;

                return matchQuery && matchType && matchEra;
            });

            // Sort items
            filtered.sort((a, b) => {
                if (sortMode === 'CHRONO') return a.chronoOrder - b.chronoOrder;
                return a.releaseOrder - b.releaseOrder;
            });

            if (filtered.length === 0) {
                container.innerHTML = `

                return;

            filtered.forEach(item => {
                if (!grouped[item.eraTitle]) grouped[item.eraTitle] = [];
                grouped[item.eraTitle].push(item);

            // Render Groups
            Object.keys(grouped).forEach(eraTitle => {
                const items = grouped[eraTitle];

                const watchedInGroup = items.filter(i => userState[i.id]?.watched).length;

                section.innerHTML = `

                        <span class="text-xs font-semibold text-blue-400 bg-blue-950/60 px-3 py-1 rounded-full border border-blue-800/60">

                const itemsContainer = section.querySelector('.era-items-container');

                items.forEach(item => {
                    const itemData = userState[item.id] || {};
                    const isWatched = !!itemData.watched;
                    const isFav = !!itemData.favorite;
                    const rating = itemData.rating || 0;
                    const hasNotes = !!itemData.note;

                    const card = document.createElement('div');

                    if (viewMode === 'GRID') {
                        // Poster Grid View Mode
                        card.className = `item-card group relative bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between ${isWatched ? 'watched' : ''}`;

                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80"></div>
                                
                                <!-- Top Action Badges -->
                                <div class="absolute top-2 left-2 right-2 flex justify-between items-center z-10">
                                    <button onclick="toggleWatched('${item.id}', event)" class="w-8 h-8 rounded-xl border backdrop-blur-md flex items-center justify-center transition shadow-lg ${isWatched ? 'bg-emerald-500 border-emerald-400 text-white' : 'bg-slate-950/70 border-slate-700/80 text-transparent hover:border-blue-400'}">

                                    <button onclick="toggleFavorite('${item.id}', event)" class="w-8 h-8 rounded-xl backdrop-blur-md bg-slate-950/70 border border-slate-700/80 flex items-center justify-center transition hover:scale-110 ${isFav ? 'text-amber-400 border-amber-500' : 'text-slate-400 hover:text-white'}">

                        card.className = `item-card bg-slate-900/80 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3 ${isWatched ? 'watched' : ''}`;

        function toggleWatched(id, e) {
            if (e) e.stopPropagation();
            if (!userState[id]) userState[id] = {};
            userState[id].watched = !userState[id].watched;
            saveState();
            renderApp();
        }

        function toggleFavorite(id, e) {
            if (e) e.stopPropagation();
            if (!userState[id]) userState[id] = {};
            userState[id].favorite = !userState[id].favorite;
            saveState();
            renderApp();
        }

        function updateProgress() {
            const total = dcDatabase.length;
            const watchedItems = dcDatabase.filter(i => userState[i.id]?.watched);
            const watchedCount = watchedItems.length;
            const percent = Math.round((watchedCount / total) * 100) || 0;

            const totalRuntimeMinutes = watchedItems.reduce((acc, item) => acc + (item.runtimeMinutes || 0), 0);
            const totalHours = Math.round(totalRuntimeMinutes / 60);

            document.getElementById('overallPercentage').innerText = `${percent}%`;
            document.getElementById('overallProgressBar').style.width = `${percent}%`;
            document.getElementById('statsWatchedCount').innerText = `${watchedCount} из ${total} просмотрено`;
            document.getElementById('statsWatchTime').innerText = `~${totalHours} ч. просмотра`;
        }

        function saveState() {
            localStorage.setItem('dc_checklist_pro_v2', JSON.stringify(userState));
        }

        function setSortMode(mode) {
            sortMode = mode;
            document.getElementById('sortReleaseBtn').className = mode === 'RELEASE' ? 'text-xs px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold transition' : 'text-xs px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white font-semibold transition';
            document.getElementById('sortChronoBtn').className = mode === 'CHRONO' ? 'text-xs px-2.5 py-1.5 rounded-lg bg-blue-600 text-white font-semibold transition' : 'text-xs px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-white font-semibold transition';
            renderApp();
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('viewGridBtn').className = mode === 'GRID' ? 'p-1.5 px-3 rounded-lg bg-blue-600 text-white text-xs font-medium transition' : 'p-1.5 px-3 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition';
            document.getElementById('viewListBtn').className = mode === 'LIST' ? 'p-1.5 px-3 rounded-lg bg-blue-600 text-white text-xs font-medium transition' : 'p-1.5 px-3 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition';
            renderApp();
        }

        function setEraFilter(era, btn) {
            currentEra = era;
            document.querySelectorAll('.era-tab').forEach(t => {
                t.classList.remove('bg-blue-900/50', 'text-blue-300', 'border-blue-700/60');
                t.classList.add('bg-slate-950', 'text-slate-400', 'border-slate-800');
            });
            if (btn) {
                btn.classList.remove('bg-slate-950', 'text-slate-400', 'border-slate-800');
                btn.classList.add('bg-blue-900/50', 'text-blue-300', 'border-blue-700/60');
            }
            renderApp();
        }

        function setTypeFilter(type, btn) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(b => {

            if (btn) {
                btn.classList.remove('bg-slate-950', 'text-slate-400', 'border-slate-800');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
            }
            renderApp();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderApp();
        }

        function openModal(id) {
            activeModalId = id;
            const item = dcDatabase.find(i => i.id === id);
            const data = userState[id] || {};

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalOrigTitle').innerText = item.origTitle;
            document.getElementById('modalTypeBadge').innerText = item.type;
            document.getElementById('modalEraBadge').innerText = item.era;
            document.getElementById('modalYear').innerText = item.year;
            document.getElementById('modalOverview').innerText = item.overview;
            document.getElementById('modalDuration').innerText = item.duration;
            document.getElementById('modalImdb').innerText = item.imdb;
            document.getElementById('modalCreditsText').innerText = item.credits || 'Информации нет';
            document.getElementById('modalNote').value = data.note || '';
            
            const posterImg = document.getElementById('modalPoster');
            posterImg.src = item.poster;
            posterImg.onerror = function() {
                this.src = `https://placehold.co/400x600/0f1422/0066ff?text=${encodeURIComponent(item.title)}`;
            };

            updateModalStars(data.rating || 0);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            activeModalId = null;
        }

        function setModalRating(val) {
            if (!activeModalId) return;
            if (!userState[activeModalId]) userState[activeModalId] = {};
            userState[activeModalId].rating = (userState[activeModalId].rating === val) ? 0 : val;
            updateModalStars(userState[activeModalId].rating);
        }

        function updateModalStars(rating) {
            const stars = document.querySelectorAll('#modalStars i');
            stars.forEach((star, idx) => {
                if (idx < rating) star.className = 'fa-solid fa-star text-amber-400';
                else star.className = 'fa-regular fa-star text-slate-700';
            });
        }

        function saveModalData() {
            if (!activeModalId) return;
            if (!userState[activeModalId]) userState[activeModalId] = {};
            userState[activeModalId].note = document.getElementById('modalNote').value;
            saveState();
            closeModal();
            renderApp();
        }

        function exportUserData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userState));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `dc_marathon_save_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        function triggerImport() {
            document.getElementById('importInput').click();
        }

        function importUserData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    userState = JSON.parse(event.target.result);
                    saveState();
                    renderApp();
                } catch (err) {
                    alert('Неверный формат файла сохранения!');
                }
            };
            reader.readAsText(file);
        }

        function confirmReset() {
            if (confirm('Вы уверены, что хотите полностью сбросить свой прогресс марафона DC?')) {
                userState = {};
                saveState();
                renderApp();
            }
        }

        // Initialize application on load
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
